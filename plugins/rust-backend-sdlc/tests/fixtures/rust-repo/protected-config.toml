override_exempt = ["tests/CLI/bats/fixtures/", "xtask/tests/fixtures/"]

# Directories that must exist in the working tree.
required_directories = [
    ".github/graphql-spec",
    ".github/openapi-spec",
    ".sqlx",
    "crates/service",
    "crates/shared/application",
