name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release this version (x.y.z) instead of the one derived from the commits'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Detect credentials
        id: credentials
        env:
          APP_ID: ${{ secrets.ACME_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ACME_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::notice::Release skipped: GitHub App secrets are not configured'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create the App token
        id: app-token
        if: steps.credentials.outputs.available == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACME_APP_ID }}
          private-key: ${{ secrets.ACME_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out the full history
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the release pushes the commit and the tag with the credentials of this checkout
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Rust
        if: steps.credentials.outputs.available == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - name: Install cocogitto
        if: steps.credentials.outputs.available == 'true'
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true

      - name: Set the bot identity
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"

      - name: Release
        if: steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            scripts/release.sh --version "$VERSION"
          else
            scripts/release.sh
          fi
